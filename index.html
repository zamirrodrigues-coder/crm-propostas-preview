<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CRM de Propostas</title>
<meta name="theme-color" content="#12233a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM ZR">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="entrada" class="entrada" hidden>
  <div class="entrada-cartao">
    <aside class="entrada-marca">
      <span class="entrada-logo">ZR</span>
      <h1>CRM de Propostas</h1>
      <span class="entrada-barra"></span>
      <p>Gestão de propostas com agilidade, organização e controle.</p>
      <svg class="entrada-curvas" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="entrada-curva" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22a884" stop-opacity=".9"/><stop offset="1" stop-color="#22a884" stop-opacity=".15"/></linearGradient></defs>
        <path d="M150 300 C230 170 260 70 400 60" fill="none" stroke="url(#entrada-curva)" stroke-width="2"/>
        <path d="M245 300 C300 200 320 120 400 115" fill="none" stroke="#22a884" stroke-opacity=".3" stroke-width="1.5"/>
      </svg>
    </aside>
    <div class="entrada-lado">
      <form class="entrada-form" id="entrada-form" novalidate>
        <h2>Acesse Sua Conta</h2>
        <p class="sub">Entre com seu e-mail e senha para continuar.</p>
        <label class="campo"><span>E-mail</span><input type="email" id="entrada-email" autocomplete="username" placeholder="nome@empresa.com.br" required></label>
        <label class="campo"><span>Senha</span><span class="senha"><input type="password" id="entrada-senha" autocomplete="current-password" required><button type="button" class="olho" aria-label="Mostrar Senha" title="Mostrar Senha"></button></span></label>
        <p class="entrada-erro" id="entrada-erro" role="alert"></p>
        <button type="submit" class="btn btn-primario btn-bloco" id="entrada-btn">Entrar</button>
      </form>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="lateral" id="lateral">
    <div class="lat-topo">
      <div class="escritorio"><span class="esc-sigla">ZR</span><span class="esc-txt rot"><strong>Zamir Rodrigues</strong><small>CRM de Propostas</small></span></div>
      <button type="button" class="nav-pino" id="nav-pino" aria-pressed="false" aria-label="Fixar o Menu Aberto" title="Fixar o Menu Aberto"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 15v6"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Menu principal"></nav>
  </aside>
  <div class="principal">
    <header class="topo">
      <div class="topo-titulo"><span class="topo-ic" id="icone-tela"></span><div><h2 id="titulo-tela"></h2><p class="topo-desc" id="desc-tela"></p></div></div>
      <div class="topo-acoes" id="topo-acoes"></div>
      <div class="usuario"><button id="usuario-btn" type="button" aria-haspopup="true"></button></div>
    </header>
    <main class="tela" id="tela"></main>
  </div>
  <nav class="nav-baixo" id="nav-baixo" aria-label="Menu principal"></nav>
</div>
<div class="menu" id="usuario-menu" hidden>
  <div class="menu-quem"><strong id="menu-nome"></strong><small id="menu-email"></small></div>
  <button type="button" id="acao-trocar-senha"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Trocar Senha</button>
  <button type="button" id="acao-sair"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>Sair</button>
</div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
